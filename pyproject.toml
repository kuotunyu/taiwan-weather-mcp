[project]
name = "taiwan-weather-mcp"
version = "0.1.0"
description = "台灣即時天氣預報、天氣特報與有感地震查詢 MCP Server（資料來源：中央氣象署開放資料平臺）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
